<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css" type="text/css" />
    <title>H2O Please</title>
</head>

<body>
   
    <header class="header-top">
        <output class="weather-api">API DEL TIEMPO</output>
        <button class="alarm-icon">🔔</button>
    </header>

    <main class="app-layout">
        
        <progress class="side-progress" value="0" min="0" max="100">
            
        </progress>
            
        <p class="accumulated">HAS BEBIDO</p>
            <p id="total">ml</p>
                    
        <p class="stat-card">3500 ml</p>
        <p>OBJETIVO DEL DÍA</p>
            
        <time id="countdown">00:00</time>
            <p class="next-alarm">CUENTA ATRÁS / SIGUIENTE ALARMA</p>

        <section class="weather-card weather-card--compact" aria-live="polite">
            <div class="weather-card__header">
                <div>
                    <p class="weather-card__eyebrow">Clima local</p>
                    <h2 id="weather-city">Ubicacion actual</h2>
                </div>
                <p id="weather-status" class="weather-card__status">Cargando clima...</p>
            </div>

            <div class="weather-card__content">
                <div class="weather-card__temperature-block">
                    <p class="weather-card__label">Temperatura</p>
                    <p id="weather-temperature" class="weather-card__temperature">-- °C</p>
                </div>

                <div class="weather-card__datetime">
                    <div>
                        <p class="weather-card__label">Fecha local</p>
                        <p id="weather-date" class="weather-card__value">--/--/----</p>
                    </div>
                    <div>
                        <p class="weather-card__label">Hora local</p>
                        <p id="weather-time" class="weather-card__value">--:--:--</p>
                    </div>
                </div>
            </div>
        </section>
            

        <form class="input-container">
             <label for="amount">Ingrese la cantidad</label>
             <input type="number" id="amount" placeholder="200">
             <button type="button" class="drink" id="add-btn">+ BEBER</button>
            </form>

        
    </main>

    <footer>
        <nav class="bottom-navigation">
        <button>HISTORIAL</button>
        <button>CALENDARIO</button>
        <button>USUARIO</button>
    </nav>
    </footer>

    

    <script type="module" src="scripts/pages/indexWeatherDemo.js"></script>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
