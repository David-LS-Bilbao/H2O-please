<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css" type="text/css" />
    <title>H2O Please</title>
</head>

<body>
   
    <header class="header-top">
        <output class="weather-api">API DEL TIEMPO</output>
        <button class="alarm-icon">🔔</button>
    </header>

    <main class="app-layout">
        
        <progress class="side-progress" value="0" min="0" max="100">
            
        </progress>
            
        <p class="accumulated">HAS BEBIDO</p>
            <p id="total">ml</p>
                    
        <p class="stat-card">3500 ml</p>
        <p>OBJETIVO DEL DÍA</p>
            
        <time id="countdown">00:00</time>
            <p>CUENTA ATRÁS / SIGUIENTE ALARMA</p>
            

        <form class="input-container">
             <label for="amount">Ingrese la cantidad</label>
             <input type="number" id="amount" placeholder="200">
             <button type="button" class="drink-button" id="add-btn">+ BEBER</button>
            </form>

        
    </main>

    <footer>
        <nav class="bottom-navigation">
        <button>HISTORIAL</button>
        <button>CALENDARIO</button>
        <button>USUARIO</button>
    </nav>
    </footer>

    

    <script type="module" src="scripts/index.js"></script>
</body>
</html>
