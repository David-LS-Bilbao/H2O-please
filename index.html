<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/styles.css" type="text/css" />
  <title>H2O Please - Acceso</title>
</head>

<body data-page="login">
  <main class="login-layout">

    <header>
      <h1>H2O Please</h1>
      <p>Gestor de hidratación personal</p>
    </header>

    <section>
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-mode="login" role="tab" aria-selected="true">
          Iniciar sesión
        </button>
        <button type="button" class="auth-tab" data-mode="register" role="tab" aria-selected="false">
          Registrarse
        </button>
      </div>

      <form id="auth-form">
        <input type="text" id="username" placeholder="Usuario" required autocomplete="username" />
        <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password" />
        <button type="submit" id="auth-submit-btn">Entrar</button>
      </form>
    </section>
  </main>

  <script type="module" src="scripts/index.js"></script>
</body>

</html>
